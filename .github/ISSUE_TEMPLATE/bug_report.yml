name: Bug report
description: Report reproducible incorrect behavior in Accretion
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Accretion. Do not report security vulnerabilities here.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest sequence of steps, task envelope, or code sample that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Deterministic fake runtime
        - Codex App Server
        - Claude Code
        - Control plane or UI
        - Not runtime-specific
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: Remove credentials, prompts, personal data, and provider session identifiers.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and sensitive data from this report.
          required: true
