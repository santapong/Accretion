name: Feature request
description: Propose a focused improvement to Accretion
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or developer problem should Accretion solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing implementation unless necessary.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: milestone
    attributes:
      label: Suggested milestone
      options:
        - P0 runtime feasibility
        - v0.1 deterministic foundation
        - v0.2 adaptive workflows
        - v0.3 platform capabilities
        - Unsure
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, compatibility, or operational risks
