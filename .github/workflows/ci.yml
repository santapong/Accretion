name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: accretion
          POSTGRES_USER: accretion
          POSTGRES_PASSWORD: accretion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accretion -d accretion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCRETION_DATABASE_URL: postgresql+asyncpg://accretion:accretion@localhost:5432/accretion
      ACCRETION_TEST_POSTGRES_URL: postgresql+asyncpg://accretion:accretion@localhost:5432/accretion
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # `uv sync` silently re-resolves, so a manifest/lock mismatch is invisible
      # to it — v0.3.0 shipped a uv.lock still naming version 0.2.0. Check first:
      # the lockfile must already agree with pyproject.toml.
      - run: uv lock --check
      - run: uv sync --all-groups
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync python scripts/check_docs.py
      - run: uv run --no-sync alembic upgrade head
      - run: uv run --no-sync alembic downgrade base
      - run: uv run --no-sync alembic upgrade head
      # Kept alongside the acceptance harness on purpose: the harness decides
      # criteria, and does not fail on a test failure that claims no criterion.
      # Without this step an unrelated regression would go unreported.
      - run: uv run --no-sync pytest -p pytest_asyncio.plugin
      # M8 cutover. The eight stage-scoped gates this replaces each ran the whole
      # suite, and every criterion they covered is in scope here: as of M8 the full
      # harness reports `unmet MUST: 0`, so the narrower gates were both redundant
      # and weaker. A stage gate also prints PASS on an empty scope, which the full
      # harness cannot do.
      - run: uv run --no-sync python scripts/check_acceptance.py
      # SDD 24.8, each condition independently failable.
      - run: uv run --no-sync python scripts/release_gate.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- apps/ui/src/api/schema.d.ts
      - run: npm run check
      - run: npm run test
      - run: npm run build

  clean-checkout:
    # SDD 24.8 requires the release to reproduce from a clean checkout. This job
    # deliberately shares nothing with `backend`: no uv cache, no reused
    # artifacts, and the generated API surface is rebuilt from source and
    # compared, so a fixture or schema that only exists on a developer's machine
    # fails here rather than after the tag is cut.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: accretion
          POSTGRES_USER: accretion
          POSTGRES_PASSWORD: accretion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accretion -d accretion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCRETION_DATABASE_URL: postgresql+asyncpg://accretion:accretion@localhost:5432/accretion
      ACCRETION_TEST_POSTGRES_URL: postgresql+asyncpg://accretion:accretion@localhost:5432/accretion
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # `uv sync` silently re-resolves, so a manifest/lock mismatch is invisible
      # to it — v0.3.0 shipped a uv.lock still naming version 0.2.0. Check first:
      # the lockfile must already agree with pyproject.toml.
      - run: uv lock --check
      - run: uv sync --all-groups
      - run: uv run --no-sync alembic upgrade head
      # The frozen evidence corpora must hash to the values the documents
      # publish when read from a fresh clone.
      - run: uv run --no-sync python scripts/check_acceptance.py
      - run: uv run --no-sync python scripts/release_gate.py
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- apps/ui/src/api/schema.d.ts
      - run: npm run build

  browser:
    # The accessibility claim that discharges issue #52 was, until now, a static document
    # that nothing re-measured - and jsdom cannot re-measure it, because it has no layout
    # engine and src/test/setup.ts fakes getBoundingClientRect. This job runs the recorded
    # procedure against the PRODUCTION BUILD on every push, so a restyle cannot quietly
    # invalidate the evidence.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: accretion
          POSTGRES_USER: accretion
          POSTGRES_PASSWORD: accretion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accretion -d accretion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCRETION_DATABASE_URL: postgresql+asyncpg://accretion:accretion@localhost:5432/accretion
      # Keep this `development`: any other value flips cookie_secure on (api/auth.py), and
      # a plain-HTTP browser then cannot store the session cookie.
      ACCRETION_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v7
        with:
          # The computed-style diff builds the merge-base with develop, and a shallow
          # checkout has no merge-base to find.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: npm ci
      - run: uv run --no-sync alembic upgrade head
      # The gate drives `vite preview` over dist/, so the build has to exist first.
      - run: npm run build
      # M9 PR5a. The Tailwind port changes the built stylesheet's text by design, so the
      # sha256 comparison PR3 and PR4 used retires here. Its replacement compares COMPUTED
      # STYLES between this branch and the merge-base, which means CI has to build both.
      #
      # node_modules is symlinked rather than installed: `npm ci` in the worktree would
      # double this job's install time and fight for the same cache. If the base commit's
      # lockfile differs, the base is built with this branch's dependencies - stated in the
      # PR body, and irrelevant to the text-level proof in `cssPort.test.ts`.
      - name: Build the merge-base for the computed-style diff
        run: |
          set -euo pipefail
          # `fetch-depth: 0` fetches all history for the CHECKED-OUT ref only; it does not
          # create refs/remotes/origin/develop. Without this line `git merge-base` fails
          # with "not a valid object name" on every branch, which is a broken step rather
          # than a failing gate.
          git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
          base=$(git merge-base HEAD origin/develop)
          echo "merge-base with develop: $base"
          git worktree add --detach ../base "$base"
          ln -s "$PWD/node_modules" ../base/node_modules
          ln -s "$PWD/apps/ui/node_modules" ../base/apps/ui/node_modules
          cd ../base
          npm run build --workspace @accretion/ui -- \
            --outDir "$GITHUB_WORKSPACE/dist-base" --emptyOutDir
      - run: npx playwright install --with-deps chromium
        working-directory: apps/ui
      - run: npx playwright test
        working-directory: apps/ui
        env:
          # Absent, `style-diff.spec.ts` fails rather than skipping: a required check that
          # silently measures nothing is worse than no check.
          STYLE_DIFF_BASE_DIST: ${{ github.workspace }}/dist-base
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/ui/playwright-report/
          retention-days: 7
