[project]
name = "accretion-control-plane"
version = "0.1.0"
description = "Local-first observable control plane for Codex and Claude Code"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "aiosqlite>=0.21,<1",
  "claude-agent-sdk>=0.1,<1",
  "fastapi>=0.116,<1",
  "platformdirs>=4.3,<5",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
accretion = "accretion.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/accretion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = ["live: requires installed and authenticated provider CLIs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["accretion"]
mypy_path = "backend/src"
warn_unused_ignores = false
