[project]
name = "accretion"
version = "0.2.0"
description = "Observable local-first multi-runtime meta-harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.19.1,<2",
  "asyncpg>=0.30,<1",
  # Direct: the token broker seals credentials with AES-GCM. It already arrived
  # transitively through pyjwt[crypto]; depending on it explicitly keeps that honest.
  "cryptography>=46,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28",
  "jsonschema>=4.26.0,<5",
  "pgvector>=0.5,<0.6",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.9",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.16.3,<1",
  "types-jsonschema>=4.25,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accretion"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL", "live: invokes a signed-in provider CLI"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ASYNC221"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.uv]
default-groups = ["dev"]
