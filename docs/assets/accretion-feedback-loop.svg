<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title description">
  <title id="title">Accretion P2 feedback-loop lifecycle</title>
  <desc id="description">A task decision enters one reusable runtime session, which produces an immutable candidate snapshot. Independent verifiers inspect the snapshot. Passing evidence completes the run, failing evidence creates structured repair findings for another bounded iteration, and inconclusive evidence or exhausted budgets escalates to a human.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100b"/>
      <stop offset="0.55" stop-color="#0b1710"/>
      <stop offset="1" stop-color="#10140f"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153422"/>
      <stop offset="1" stop-color="#0e2117"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302514"/>
      <stop offset="1" stop-color="#1f180f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#75db91"/>
    </marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f1b55e"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef8b79"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; font-style: normal; }
      .eyebrow { fill: #75db91; font-size: 17px; font-weight: 700; letter-spacing: 3px; }
      .heading { fill: #f4f8f5; font-size: 36px; font-weight: 700; }
      .subtitle { fill: #a9b9ae; font-size: 19px; }
      .step { fill: #08110c; font-size: 16px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
      .card-title { fill: #f6faf7; font-size: 22px; font-weight: 700; }
      .card-copy { fill: #c8d4cc; font-size: 16px; }
      .small-title { fill: #f4f8f5; font-size: 18px; font-weight: 700; }
      .small-copy { fill: #aebcb3; font-size: 15px; }
      .label { fill: #8fa097; font-size: 14px; font-weight: 700; letter-spacing: 0.8px; text-anchor: middle; }
      .pass { fill: #75db91; font-size: 18px; font-weight: 700; }
      .repair { fill: #f1b55e; font-size: 18px; font-weight: 700; }
      .escalate { fill: #ef8b79; font-size: 18px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="700" rx="32" fill="url(#background)"/>
  <path d="M0 620 C300 565 510 665 810 610 C1080 560 1320 650 1600 575" fill="none" stroke="#1d3a29" stroke-width="1.5" opacity="0.45"/>

  <text x="64" y="62" class="eyebrow">P2 EXECUTION LIFECYCLE</text>
  <text x="64" y="110" class="heading">Observe, verify, repair — within hard bounds</text>
  <text x="64" y="144" class="subtitle">One reusable provider session. Immutable evidence. Explicit outcomes.</text>

  <!-- Main lifecycle cards -->
  <g filter="url(#shadow)">
    <rect x="64" y="208" width="270" height="190" rx="22" fill="#101d15" stroke="#2b5c3b" stroke-width="2"/>
    <circle cx="101" cy="248" r="18" fill="#75db91"/>
    <text x="101" y="248" class="step">1</text>
    <text x="133" y="256" class="card-title">Task decision</text>
    <text x="94" y="303" class="card-copy">DIRECT or LOOP template</text>
    <text x="94" y="335" class="card-copy">budgets + capability gates</text>
    <text x="94" y="367" class="card-copy">acceptance policy reference</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="398" y="208" width="270" height="190" rx="22" fill="url(#amberCard)" stroke="#8a6631" stroke-width="2"/>
    <circle cx="435" cy="248" r="18" fill="#f1b55e"/>
    <text x="435" y="248" class="step">2</text>
    <text x="467" y="256" class="card-title">Runtime call</text>
    <text x="428" y="303" class="card-copy">one reusable session</text>
    <text x="428" y="335" class="card-copy">normalized progress events</text>
    <text x="428" y="367" class="card-copy">isolated Git worktree</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="732" y="208" width="270" height="190" rx="22" fill="#101d15" stroke="#2b5c3b" stroke-width="2"/>
    <circle cx="769" cy="248" r="18" fill="#75db91" filter="url(#glow)"/>
    <text x="769" y="248" class="step">3</text>
    <text x="801" y="256" class="card-title">Snapshot</text>
    <text x="762" y="303" class="card-copy">immutable candidate patch</text>
    <text x="762" y="335" class="card-copy">captured output fingerprints</text>
    <text x="762" y="367" class="card-copy">digest-bound evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1066" y="208" width="270" height="190" rx="22" fill="url(#greenCard)" stroke="#3f8a58" stroke-width="2"/>
    <circle cx="1103" cy="248" r="18" fill="#75db91"/>
    <text x="1103" y="248" class="step">4</text>
    <text x="1135" y="256" class="card-title">Independent verify</text>
    <text x="1096" y="303" class="card-copy">output + diff contracts</text>
    <text x="1096" y="335" class="card-copy">trajectory policy checks</text>
    <text x="1096" y="367" class="card-copy">fail-closed acceptance</text>
  </g>

  <line x1="334" y1="303" x2="388" y2="303" stroke="#75db91" stroke-width="4" marker-end="url(#greenArrow)"/>
  <line x1="668" y1="303" x2="722" y2="303" stroke="#f1b55e" stroke-width="4" marker-end="url(#amberArrow)"/>
  <line x1="1002" y1="303" x2="1056" y2="303" stroke="#75db91" stroke-width="4" marker-end="url(#greenArrow)"/>
  <text x="361" y="280" class="label">CALL</text>
  <text x="695" y="280" class="label">CAPTURE</text>
  <text x="1029" y="280" class="label">CHECK</text>

  <!-- Outcomes -->
  <path d="M1200 398 V453 H858 V485" fill="none" stroke="#75db91" stroke-width="3" marker-end="url(#greenArrow)"/>
  <path d="M1200 398 V485" fill="none" stroke="#f1b55e" stroke-width="3" marker-end="url(#amberArrow)"/>
  <path d="M1200 398 V453 H1430 V485" fill="none" stroke="#ef8b79" stroke-width="3" marker-end="url(#redArrow)"/>

  <g>
    <rect x="730" y="485" width="255" height="90" rx="18" fill="#102519" stroke="#3f8a58" stroke-width="2"/>
    <text x="756" y="522" class="pass">PASS → complete</text>
    <text x="756" y="550" class="small-copy">durable RUN_COMPLETED</text>
  </g>
  <g>
    <rect x="1068" y="485" width="255" height="90" rx="18" fill="#2a2113" stroke="#8a6631" stroke-width="2"/>
    <text x="1094" y="522" class="repair">FAIL → repair</text>
    <text x="1094" y="550" class="small-copy">structured findings</text>
  </g>
  <g>
    <rect x="1400" y="485" width="145" height="90" rx="18" fill="#291816" stroke="#8a4036" stroke-width="2"/>
    <text x="1420" y="522" class="escalate">ESCALATE</text>
    <text x="1420" y="550" class="small-copy">human review</text>
  </g>

  <!-- Repair loop -->
  <path d="M1195 575 C1195 635 560 650 532 402" fill="none" stroke="#f1b55e" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#amberArrow)"/>
  <rect x="690" y="598" width="255" height="30" rx="15" fill="#2a2113" stroke="#8a6631"/>
  <text x="817" y="618" class="label">REPAIR DIRECTIVE • ITERATION N+1</text>

  <text x="64" y="650" class="small-copy">Every iteration consumes persisted wall-time, turn, tool-call, and iteration budgets.</text>
</svg>
