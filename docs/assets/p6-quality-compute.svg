<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" role="img" aria-labelledby="title description">
  <title id="title">P6 frozen replay quality versus candidate count</title>
  <desc id="description">A line chart shows mean verified quality increasing from 0.4725 at one candidate, to 0.608333 at two candidates, and 0.768333 at four candidates. Verified acceptance increases from 8 of 12 tasks, to 10 of 12, to 12 of 12. The chart represents a deterministic frozen replay suite, not live-provider performance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07120c"/><stop offset="1" stop-color="#102319"/></linearGradient>
    <style>.h{font:700 31px system-ui,sans-serif;fill:#f0f6f1}.sub{font:16px system-ui,sans-serif;fill:#aebdb2}.axis{stroke:#496052;stroke-width:2}.grid{stroke:#284033;stroke-width:1}.line{fill:none;stroke:#75db91;stroke-width:6}.dot{fill:#75db91;stroke:#dff7e5;stroke-width:3}.label{font:700 18px system-ui,sans-serif;fill:#f1f6f2}.small{font:14px system-ui,sans-serif;fill:#adbbb1}.accent{font:700 15px system-ui,sans-serif;fill:#f1b55e}</style>
  </defs>
  <rect width="1400" height="640" rx="24" fill="url(#bg)"/>
  <text x="65" y="62" class="h">Frozen replay: verified quality grows with bounded compute</text>
  <text x="65" y="94" class="sub">12 held-out tasks · candidate counts fixed at N=1, 2, 4 · deterministic replay only</text>
  <line x1="145" y1="500" x2="1080" y2="500" class="axis"/><line x1="145" y1="145" x2="145" y2="500" class="axis"/>
  <line x1="145" y1="411" x2="1080" y2="411" class="grid"/><line x1="145" y1="322" x2="1080" y2="322" class="grid"/><line x1="145" y1="233" x2="1080" y2="233" class="grid"/><line x1="145" y1="145" x2="1080" y2="145" class="grid"/>
  <text x="92" y="506" class="small">0.0</text><text x="92" y="417" class="small">0.2</text><text x="92" y="328" class="small">0.4</text><text x="92" y="239" class="small">0.6</text><text x="92" y="151" class="small">0.8</text>
  <path d="M300 290L610 230L980 159" class="line"/>
  <circle cx="300" cy="290" r="10" class="dot"/><circle cx="610" cy="230" r="10" class="dot"/><circle cx="980" cy="159" r="10" class="dot"/>
  <text x="257" y="270" class="label">0.4725</text><text x="565" y="210" class="label">0.608333</text><text x="933" y="139" class="label">0.768333</text>
  <text x="278" y="540" class="label">N=1</text><text x="588" y="540" class="label">N=2</text><text x="958" y="540" class="label">N=4</text>
  <rect x="1135" y="145" width="205" height="355" rx="18" fill="#182419" stroke="#756032" stroke-width="2"/>
  <text x="1162" y="184" class="accent">VERIFIED ACCEPTS</text><text x="1162" y="234" class="label">8 / 12</text><text x="1162" y="260" class="small">66.6667% at N=1</text><text x="1162" y="321" class="label">10 / 12</text><text x="1162" y="347" class="small">83.3333% at N=2</text><text x="1162" y="408" class="label">12 / 12</text><text x="1162" y="434" class="small">100% at N=4</text><text x="1162" y="472" class="small">One null-gain task</text>
  <text x="700" y="598" text-anchor="middle" class="accent">QUALITY GAIN IS EVIDENCE FOR THIS FIXTURE — NOT A CLAIM ABOUT LIVE PROVIDERS</text>
</svg>
