<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title description">
  <title id="title">Accretion protected delivery workflow</title>
  <desc id="description">Feature, fix, documentation, and maintenance branches open pull requests into develop. Backend and frontend checks gate squash merges. Planned release pull requests promote develop to main, while urgent hotfix branches target main and are back-merged. Immutable semantic version tags mark releases.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100b"/><stop offset="1" stop-color="#111710"/></linearGradient>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#75db91"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f1b55e"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.eyebrow{fill:#75db91;font-size:17px;font-weight:700;letter-spacing:3px}.heading{fill:#f4f8f5;font-size:36px;font-weight:700}.sub{fill:#a9b9ae;font-size:18px}.title{fill:#f6faf7;font-size:21px;font-weight:700}.copy{fill:#b9c8be;font-size:15px}.pill{fill:#75db91;font-size:13px;font-weight:800;letter-spacing:1px;text-anchor:middle}.amber{fill:#f1b55e}.label{fill:#8fa097;font-size:13px;font-weight:700;letter-spacing:1px;text-anchor:middle}</style>
  </defs>
  <rect width="1500" height="620" rx="30" fill="url(#bg)"/><text x="60" y="64" class="eyebrow">DELIVERY WORKFLOW</text><text x="60" y="112" class="heading">Every change enters through evidence-backed review</text><text x="60" y="146" class="sub">Protected branches, squash history, required CI, and immutable release tags.</text>
  <g>
    <rect x="60" y="226" width="225" height="170" rx="20" fill="#101d15" stroke="#315d40" stroke-width="2"/><text x="86" y="266" class="title">Short-lived branch</text><text x="86" y="302" class="copy">feature/* · fix/*</text><text x="86" y="329" class="copy">docs/* · chore/*</text><rect x="86" y="352" width="128" height="24" rx="12" fill="#1f5132"/><text x="150" y="369" class="pill">FROM DEVELOP</text>
    <rect x="343" y="226" width="225" height="170" rx="20" fill="#211a10" stroke="#7c5c2c" stroke-width="2"/><text x="369" y="266" class="title">Pull request</text><text x="369" y="302" class="copy">focused outcome</text><text x="369" y="329" class="copy">resolved conversations</text><rect x="369" y="352" width="120" height="24" rx="12" fill="#60451f"/><text x="429" y="369" class="pill amber">REVIEW</text>
    <rect x="626" y="202" width="248" height="218" rx="20" fill="#10251a" stroke="#3f8a58" stroke-width="2"/><text x="652" y="242" class="title">Required CI</text><rect x="652" y="270" width="196" height="48" rx="12" fill="#0a150e" stroke="#315d40"/><text x="674" y="299" class="copy">Backend + migrations</text><rect x="652" y="331" width="196" height="48" rx="12" fill="#0a150e" stroke="#315d40"/><text x="674" y="360" class="copy">Frontend + build</text><text x="750" y="402" class="label">BOTH MUST PASS</text>
    <rect x="932" y="226" width="225" height="170" rx="20" fill="#101d15" stroke="#315d40" stroke-width="2"/><text x="958" y="266" class="title">develop</text><text x="958" y="302" class="copy">next-release integration</text><text x="958" y="329" class="copy">squash commits only</text><rect x="958" y="352" width="136" height="24" rx="12" fill="#1f5132"/><text x="1026" y="369" class="pill">PROTECTED</text>
    <rect x="1215" y="226" width="225" height="170" rx="20" fill="#211a10" stroke="#7c5c2c" stroke-width="2"/><text x="1241" y="266" class="title">main + tag</text><text x="1241" y="302" class="copy">release PR from develop</text><text x="1241" y="329" class="copy">vX.Y.Z is immutable</text><rect x="1241" y="352" width="144" height="24" rx="12" fill="#60451f"/><text x="1313" y="369" class="pill amber">STABLE</text>
    <path d="M285 311H333" stroke="#75db91" stroke-width="4" marker-end="url(#g)"/><path d="M568 311H616" stroke="#f1b55e" stroke-width="4" marker-end="url(#a)"/><path d="M874 311H922" stroke="#75db91" stroke-width="4" marker-end="url(#g)"/><path d="M1157 311H1205" stroke="#f1b55e" stroke-width="4" marker-end="url(#a)"/>
  </g>
  <path d="M1328 420V492H1044V420" fill="none" stroke="#f1b55e" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#a)"/><text x="1186" y="481" class="label">HOTFIX → MAIN → BACK-MERGE TO DEVELOP</text>
  <text x="750" y="557" class="label">NO DIRECT PUSH • NO FORCE PUSH • NO MOVING RELEASE TAGS</text>
</svg>
