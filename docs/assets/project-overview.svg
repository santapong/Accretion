<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title description">
  <title id="title">Accretion: from intent to verified work</title>
  <desc id="description">Four stages explain an Accretion run. The operator defines an objective, required outputs and limits. Deterministic policy selects a workflow and gates capabilities. A runtime executes in an isolated Git worktree. Independent verifiers inspect an immutable candidate. PASS completes the run, FAIL can return structured repair findings while budget remains, and INCONCLUSIVE escalates to the operator. This is a conceptual workflow, not a product screenshot or a claim of live-provider routing benefit.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#07100c"/><stop offset="1" stop-color="#101813"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#83d4a3" stroke-width="1.6"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2.5px;fill:#83d4a3}.heading{font-size:34px;font-weight:700;fill:#f5f2e9}.intro{font-size:17px;fill:#aec0b5}.number{font-size:15px;fill:#83d4a3;font-family:monospace}.label{font-size:24px;font-weight:700;fill:#f5f2e9}.body{font-size:17px;fill:#c0cfc6}.detail{font-size:14px;fill:#94aa9c}.outcome{font-size:16px;font-weight:700;fill:#f5f2e9}.hint{font-size:14px;fill:#aec0b5}
    </style>
  </defs>
  <rect width="1200" height="510" rx="20" fill="url(#background)"/>
  <text x="40" y="45" class="eyebrow">THE EXECUTION MODEL</text>
  <text x="40" y="91" class="heading">From intent to verified work</text>
  <text x="40" y="122" class="intro">One governed workflow. An inspectable decision at every stage.</text>

  <g fill="none" stroke="#83d4a3" stroke-width="2" marker-end="url(#arrow)">
    <path d="M290 263H328"/>
    <path d="M580 263H618"/>
    <path d="M870 263H908"/>
  </g>
  <g>
    <rect x="40" y="161" width="250" height="214" rx="14" fill="#0e1b14" stroke="#2b4937"/>
    <path d="M64 185H103" stroke="#83d4a3" stroke-width="2"/>
    <text x="243" y="190" class="number">01</text>
    <text x="64" y="236" class="label">Define</text>
    <text x="64" y="274" class="body">Objective and outputs</text>
    <text x="64" y="301" class="body">Constraints and budgets</text>
    <text x="64" y="346" class="detail">Operator · UI or API</text>
  </g>
  <g>
    <rect x="330" y="161" width="250" height="214" rx="14" fill="#0e1b14" stroke="#2b4937"/>
    <path d="M354 185H393" stroke="#83d4a3" stroke-width="2"/>
    <text x="533" y="190" class="number">02</text>
    <text x="354" y="236" class="label">Plan</text>
    <text x="354" y="274" class="body">Select the workflow</text>
    <text x="354" y="301" class="body">Check policy and approvals</text>
    <text x="354" y="346" class="detail">Deterministic control</text>
  </g>
  <g>
    <rect x="620" y="161" width="250" height="214" rx="14" fill="#1b1a11" stroke="#605032"/>
    <path d="M644 185H683" stroke="#e6b26a" stroke-width="2"/>
    <text x="823" y="190" class="number" style="fill:#e6b26a">03</text>
    <text x="644" y="236" class="label">Execute</text>
    <text x="644" y="274" class="body">Run the selected agent</text>
    <text x="644" y="301" class="body">Capture events and diffs</text>
    <text x="644" y="346" class="detail">Isolated Git worktree</text>
  </g>
  <g>
    <rect x="910" y="161" width="250" height="214" rx="14" fill="#0e1b14" stroke="#4f8a66"/>
    <path d="M934 185H973" stroke="#83d4a3" stroke-width="2"/>
    <text x="1113" y="190" class="number">04</text>
    <text x="934" y="236" class="label">Verify</text>
    <text x="934" y="274" class="body">Inspect a frozen candidate</text>
    <text x="934" y="301" class="body">Decide from evidence</text>
    <text x="934" y="346" class="detail">Independent verifiers</text>
  </g>

  <path d="M40 405H1160" stroke="#2b4134"/>
  <circle cx="49" cy="442" r="4" fill="#83d4a3"/>
  <text x="64" y="447" class="outcome">PASS</text><text x="126" y="447" class="hint">Complete the run</text>
  <circle cx="394" cy="442" r="4" fill="#e6b26a"/>
  <text x="409" y="447" class="outcome">FAIL</text><text x="463" y="447" class="hint">Repair while budget remains</text>
  <circle cx="812" cy="442" r="4" fill="#a4b3aa"/>
  <text x="827" y="447" class="outcome">INCONCLUSIVE</text><text x="963" y="447" class="hint">Escalate to the operator</text>
  <text x="40" y="482" class="detail">Durable state and ordered events preserve the decision history across every stage.</text>
</svg>
