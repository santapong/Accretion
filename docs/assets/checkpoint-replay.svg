<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title description">
  <title id="title">Accretion checkpoint, reconciliation, and replay lifecycle</title>
  <desc id="description">A validated static graph advances through durable node transitions. Checkpoints bind the graph, cursor, session, workspace, and event sequence. After interruption, reconciliation classifies durable evidence and either resumes exactly once, requests human review, or terminates safely. Replay reconstructs a read-only trace without re-executing side effects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100b"/><stop offset="1" stop-color="#111710"/></linearGradient><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#75db91"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f1b55e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef8b79"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.eyebrow{fill:#75db91;font-size:17px;font-weight:700;letter-spacing:3px}.heading{fill:#f4f8f5;font-size:36px;font-weight:700}.sub{fill:#a9b9ae;font-size:18px}.title{fill:#f6faf7;font-size:20px;font-weight:700}.copy{fill:#b9c8be;font-size:15px}.label{fill:#8fa097;font-size:13px;font-weight:700;letter-spacing:1px;text-anchor:middle}.pass{fill:#75db91;font-size:16px;font-weight:700}.warn{fill:#f1b55e;font-size:16px;font-weight:700}.stop{fill:#ef8b79;font-size:16px;font-weight:700}</style>
  </defs>
  <rect width="1500" height="650" rx="30" fill="url(#bg)"/><text x="60" y="64" class="eyebrow">P3 RECOVERY LIFECYCLE</text><text x="60" y="112" class="heading">Resume only from durable, classified evidence</text><text x="60" y="146" class="sub">Checkpoint state is authoritative; replay observes history and never repeats side effects.</text>
  <g>
    <rect x="60" y="220" width="235" height="170" rx="20" fill="#101d15" stroke="#315d40" stroke-width="2"/><text x="86" y="260" class="title">Validated graph</text><text x="86" y="298" class="copy">static template checksum</text><text x="86" y="326" class="copy">node + edge contracts</text><text x="86" y="354" class="copy">bounded cursor</text>
    <rect x="347" y="220" width="235" height="170" rx="20" fill="#10251a" stroke="#3f8a58" stroke-width="2"/><text x="373" y="260" class="title">Checkpoint</text><text x="373" y="298" class="copy">event sequence</text><text x="373" y="326" class="copy">session + workspace</text><text x="373" y="354" class="copy">revision + budget</text>
    <rect x="634" y="220" width="235" height="170" rx="20" fill="#291816" stroke="#83483c" stroke-width="2"/><text x="660" y="260" class="title">Interruption</text><text x="660" y="298" class="copy">process exit or restart</text><text x="660" y="326" class="copy">provider disconnect</text><text x="660" y="354" class="copy">uncertain side effect</text>
    <rect x="921" y="220" width="235" height="170" rx="20" fill="#211a10" stroke="#7c5c2c" stroke-width="2"/><text x="947" y="260" class="title">Reconcile</text><text x="947" y="298" class="copy">read durable events</text><text x="947" y="326" class="copy">validate workspace</text><text x="947" y="354" class="copy">classify once</text>
    <path d="M295 305H337" stroke="#75db91" stroke-width="4" marker-end="url(#g)"/><path d="M582 305H624" stroke="#ef8b79" stroke-width="4" marker-end="url(#r)"/><path d="M869 305H911" stroke="#f1b55e" stroke-width="4" marker-end="url(#a)"/>
  </g>
  <g>
    <path d="M1156 272H1210" stroke="#75db91" stroke-width="3" marker-end="url(#g)"/><rect x="1220" y="206" width="222" height="86" rx="17" fill="#10251a" stroke="#3f8a58"/><text x="1244" y="240" class="pass">RESUMABLE</text><text x="1244" y="267" class="copy">continue exactly once</text>
    <path d="M1156 305H1190V347H1210" fill="none" stroke="#f1b55e" stroke-width="3" marker-end="url(#a)"/><rect x="1220" y="306" width="222" height="86" rx="17" fill="#211a10" stroke="#7c5c2c"/><text x="1244" y="340" class="warn">REQUIRES HUMAN</text><text x="1244" y="367" class="copy">preserve uncertainty</text>
    <path d="M1156 338H1178V445H1210" fill="none" stroke="#ef8b79" stroke-width="3" marker-end="url(#r)"/><rect x="1220" y="406" width="222" height="86" rx="17" fill="#291816" stroke="#83483c"/><text x="1244" y="440" class="stop">TERMINAL</text><text x="1244" y="467" class="copy">fail or cancel safely</text>
  </g>
  <path d="M464 390V530H1038V400" fill="none" stroke="#75db91" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#g)"/><rect x="626" y="506" width="250" height="46" rx="14" fill="#0d1b12" stroke="#315d40"/><text x="751" y="535" class="label">READ-ONLY TRACE REPLAY</text>
  <text x="750" y="602" class="label">NO BLIND RETRY • NO REPLAYED SIDE EFFECT • NO STATE INFERRED FROM UI CACHE</text>
</svg>
