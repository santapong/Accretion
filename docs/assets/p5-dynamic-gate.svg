<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">P5 dynamic workflow research gate</title>
  <desc id="description">Twelve held-out tasks are divided into predictable, heterogeneous, and uncertain cohorts. Static and dynamic workflow treatments are compared with the same cost-adjusted utility. The release gate records positive uplift on heterogeneous and uncertain tasks, non-inferiority on predictable tasks, no v0.1 safety regression, and operational static fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07151f"/><stop offset="1" stop-color="#10251c"/></linearGradient>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.title{font-size:25px;font-weight:700;fill:#f3f8f5}.label{font-size:15px;font-weight:700;fill:#dff7e7}.copy{font-size:13px;fill:#b7c9c0}.metric{font-family:monospace;font-size:22px;font-weight:700;fill:#75e39a}.box{fill:#122a23;stroke:#3f7656;stroke-width:2}.arrow{stroke:#75e39a;stroke-width:3;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#75e39a"/></marker>
  </defs>
  <rect width="960" height="420" rx="24" fill="url(#bg)"/>
  <text x="48" y="55" class="title">P5 · frozen static versus dynamic evidence</text>
  <g transform="translate(48 92)">
    <rect class="box" width="230" height="220" rx="18"/><text x="22" y="35" class="label">12 held-out tasks</text>
    <text x="22" y="70" class="copy">4 predictable</text><text x="22" y="98" class="copy">4 heterogeneous</text><text x="22" y="126" class="copy">4 uncertain</text>
    <text x="22" y="164" class="copy">IMPLEMENT · REVIEW</text><text x="22" y="190" class="copy">ANALYSIS · RESEARCH</text>
  </g>
  <path class="arrow" d="M298 202H350"/>
  <g transform="translate(370 92)">
    <rect class="box" width="230" height="220" rx="18"/><text x="22" y="35" class="label">Paired treatments</text>
    <text x="22" y="72" class="copy">v0.1 static template</text><text x="22" y="100" class="copy">v0.2 planner + validator</text>
    <text x="22" y="142" class="copy">quality · usage · latency</text><text x="22" y="170" class="copy">risk · human burden</text><text x="22" y="198" class="copy">structure · replan · fallback</text>
  </g>
  <path class="arrow" d="M620 202H672"/>
  <g transform="translate(692 92)">
    <rect class="box" width="220" height="220" rx="18"/><text x="22" y="35" class="label">Release classification</text>
    <text x="22" y="78" class="metric">+0.224631</text><text x="22" y="101" class="copy">heterogeneous/uncertain</text>
    <text x="22" y="139" class="metric">+0.009195</text><text x="22" y="162" class="copy">predictable cohort</text>
    <text x="22" y="199" class="label">PASS · POSITIVE</text>
  </g>
  <text x="48" y="365" class="copy">Hard boundary: safety regression, false acceptance, privilege expansion, or failed static fallback always blocks release.</text>
</svg>
