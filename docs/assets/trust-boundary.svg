<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" role="img" aria-labelledby="title description">
  <title id="title">Accretion trust and authority boundary</title>
  <desc id="description">An operator defines a bounded task envelope. Deterministic policy validates requested capabilities, a credential broker injects secrets only into an approved executor, and provider runtimes receive scoped tools rather than raw credentials. Durable intent and results surround every external side effect.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100b"/><stop offset="1" stop-color="#10140f"/></linearGradient>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#75db91"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f1b55e"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.eyebrow{fill:#75db91;font-size:17px;font-weight:700;letter-spacing:3px}.heading{fill:#f4f8f5;font-size:36px;font-weight:700}.sub{fill:#a9b9ae;font-size:18px}.zone{fill:#0d1a12;stroke:#315d40;stroke-width:2}.zone.outside{fill:#20190f;stroke:#77572a}.title{fill:#f6faf7;font-size:22px;font-weight:700}.copy{fill:#bcc9c0;font-size:15px}.rule{fill:#75db91;font-size:15px;font-weight:700}.warn{fill:#f1b55e;font-size:15px;font-weight:700}.label{fill:#8fa097;font-size:13px;font-weight:700;letter-spacing:1px;text-anchor:middle}.deny{fill:#ef8b79;font-size:15px;font-weight:700}
    </style>
  </defs>
  <rect width="1500" height="680" rx="30" fill="url(#bg)"/>
  <text x="60" y="64" class="eyebrow">TRUST BOUNDARY</text><text x="60" y="112" class="heading">Agents receive capabilities, never raw credentials</text><text x="60" y="146" class="sub">Authority remains in deterministic code before, during, and after every provider call.</text>
  <rect x="58" y="196" width="985" height="405" rx="24" class="zone"/><text x="86" y="232" class="rule">DETERMINISTIC ACCRETION CORE</text>
  <rect x="1073" y="196" width="369" height="405" rx="24" class="zone outside"/><text x="1101" y="232" class="warn">EXTERNAL / PROVIDER CONTEXT</text>
  <g>
    <rect x="88" y="275" width="206" height="166" rx="18" fill="#12251a" stroke="#3d7a50"/><text x="112" y="311" class="title">Task envelope</text><text x="112" y="347" class="copy">objective + risk</text><text x="112" y="374" class="copy">allowed / denied tools</text><text x="112" y="401" class="copy">budgets + outputs</text>
    <rect x="342" y="275" width="206" height="166" rx="18" fill="#12251a" stroke="#3d7a50"/><text x="366" y="311" class="title">Policy engine</text><text x="366" y="347" class="copy">deny by default</text><text x="366" y="374" class="copy">approval ceilings</text><text x="366" y="401" class="copy">scope intersection</text>
    <rect x="596" y="275" width="206" height="166" rx="18" fill="#12251a" stroke="#3d7a50"/><text x="620" y="311" class="title">Broker</text><text x="620" y="347" class="copy">resolve credential refs</text><text x="620" y="374" class="copy">inject at execution edge</text><text x="620" y="401" class="copy">never serialize secret</text>
    <rect x="850" y="275" width="164" height="166" rx="18" fill="#211a10" stroke="#80602e"/><text x="874" y="311" class="title">Executor</text><text x="874" y="347" class="copy">persist intent</text><text x="874" y="374" class="copy">perform once</text><text x="874" y="401" class="copy">persist result</text>
    <path d="M294 358H332" stroke="#75db91" stroke-width="4" marker-end="url(#green)"/><path d="M548 358H586" stroke="#75db91" stroke-width="4" marker-end="url(#green)"/><path d="M802 358H840" stroke="#f1b55e" stroke-width="4" marker-end="url(#amber)"/>
    <rect x="1103" y="275" width="309" height="166" rx="18" fill="#291f11" stroke="#80602e"/><text x="1127" y="311" class="title">Runtime adapter</text><text x="1127" y="347" class="copy">scoped capability descriptors</text><text x="1127" y="374" class="copy">normalized event protocol</text><text x="1127" y="401" class="copy">isolated mutable workspace</text>
    <path d="M1014 358H1093" stroke="#f1b55e" stroke-width="4" marker-end="url(#amber)"/>
  </g>
  <line x1="1058" y1="186" x2="1058" y2="610" stroke="#ef8b79" stroke-width="3" stroke-dasharray="10 8"/><text x="1058" y="635" class="label">NO RAW SECRET CROSSES THIS LINE</text>
  <rect x="88" y="485" width="926" height="76" rx="16" fill="#0a140e" stroke="#2b5438"/><text x="112" y="516" class="rule">Durable evidence ledger</text><text x="112" y="542" class="copy">requested scope → authorization decision → idempotency key → side-effect intent → terminal result</text>
  <rect x="1103" y="485" width="309" height="76" rx="16" fill="#241512" stroke="#83483c"/><text x="1127" y="517" class="deny">Unavailable or uncertain?</text><text x="1127" y="543" class="copy">INCONCLUSIVE → human review</text>
</svg>
