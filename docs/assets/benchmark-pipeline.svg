<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title description">
  <title id="title">ACR-ARCH benchmark pipeline</title>
  <desc id="description">Frozen tasks, environment definitions, and replay traces enter a deterministic runner. The runner normalizes execution evidence, computes architecture and outcome metrics, and emits reproducible reports. Optional signed-in live samples are calibrated separately and never replace the replay baseline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100b"/><stop offset="1" stop-color="#111710"/></linearGradient><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#75db91"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f1b55e"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.eyebrow{fill:#75db91;font-size:17px;font-weight:700;letter-spacing:3px}.heading{fill:#f4f8f5;font-size:36px;font-weight:700}.sub{fill:#a9b9ae;font-size:18px}.title{fill:#f6faf7;font-size:21px;font-weight:700}.copy{fill:#b9c8be;font-size:15px}.mono{fill:#75db91;font-size:14px;font-family:monospace}.label{fill:#8fa097;font-size:13px;font-weight:700;letter-spacing:1px;text-anchor:middle}.amber{fill:#f1b55e}</style>
  </defs>
  <rect width="1500" height="620" rx="30" fill="url(#bg)"/><text x="60" y="64" class="eyebrow">ACR-ARCH V0.1</text><text x="60" y="112" class="heading">Frozen evidence in, reproducible architecture metrics out</text><text x="60" y="146" class="sub">Replay is the baseline. Live provider samples are opt-in calibration evidence.</text>
  <g>
    <rect x="58" y="208" width="272" height="238" rx="22" fill="#101d15" stroke="#315d40" stroke-width="2"/><text x="84" y="247" class="title">Frozen inputs</text><text x="84" y="288" class="mono">tasks.v1.json</text><text x="84" y="320" class="mono">environments.v1.json</text><text x="84" y="352" class="mono">replay-traces.v1.json</text><text x="84" y="400" class="copy">SHA-256 fingerprints bind</text><text x="84" y="424" class="copy">every reported result.</text>
    <rect x="390" y="208" width="272" height="238" rx="22" fill="#211a10" stroke="#7c5c2c" stroke-width="2"/><text x="416" y="247" class="title">Deterministic runner</text><text x="416" y="288" class="copy">seed benchmark records</text><text x="416" y="320" class="copy">replay provider traces</text><text x="416" y="352" class="copy">preserve selector versions</text><text x="416" y="400" class="mono">scripts/generate_…</text><text x="416" y="424" class="mono">benchmark.py</text>
    <rect x="722" y="208" width="272" height="238" rx="22" fill="#101d15" stroke="#315d40" stroke-width="2"/><text x="748" y="247" class="title">Normalize evidence</text><text x="748" y="288" class="copy">task + environment</text><text x="748" y="320" class="copy">strategy + runtime</text><text x="748" y="352" class="copy">events + verification</text><text x="748" y="400" class="copy">One schema across providers</text><text x="748" y="424" class="copy">and execution sources.</text>
    <rect x="1054" y="208" width="388" height="238" rx="22" fill="#10251a" stroke="#3f8a58" stroke-width="2"/><text x="1080" y="247" class="title">Report with provenance</text><text x="1080" y="288" class="copy">completion + verified success</text><text x="1080" y="320" class="copy">architecture utilization</text><text x="1080" y="352" class="copy">latency + cost observables</text><rect x="1080" y="382" width="330" height="40" rx="12" fill="#0a150e" stroke="#315d40"/><text x="1245" y="407" class="label">FILTERABLE API + OPERATOR UI</text>
    <path d="M330 327H380" stroke="#75db91" stroke-width="4" marker-end="url(#g)"/><path d="M662 327H712" stroke="#f1b55e" stroke-width="4" marker-end="url(#a)"/><path d="M994 327H1044" stroke="#75db91" stroke-width="4" marker-end="url(#g)"/>
  </g>
  <path d="M526 468V522H1248V458" fill="none" stroke="#f1b55e" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#a)"/><text x="886" y="511" class="label amber">OPTIONAL LIVE SAMPLE • RECORDED SEPARATELY • NEVER SILENTLY MIXED</text>
  <text x="750" y="570" class="label">STATIC BASELINE FIRST • NEGATIVE RESULTS PRESERVED • EVERY CLAIM REPRODUCIBLE</text>
</svg>
