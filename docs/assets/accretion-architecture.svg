<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title description">
  <title id="title">Accretion system architecture</title>
  <desc id="description">An operator uses the React interface, which sends tasks to the FastAPI control plane for deterministic planning, bounded feedback execution, and independent verification. Runtime adapters connect to Codex, Claude, or a deterministic fake runtime. PostgreSQL preserves state and events, while disposable Git worktrees isolate changes. Resumable server-sent events return a live trace to the interface.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100b"/>
      <stop offset="0.55" stop-color="#0b1710"/>
      <stop offset="1" stop-color="#10140f"/>
    </linearGradient>
    <linearGradient id="controlPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153422"/>
      <stop offset="1" stop-color="#0e2117"/>
    </linearGradient>
    <linearGradient id="runtimePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f2414"/>
      <stop offset="1" stop-color="#1e180f"/>
    </linearGradient>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#75db91"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f1b55e"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; font-style: normal; }
      .eyebrow { fill: #75db91; font-size: 18px; font-weight: 700; letter-spacing: 3px; }
      .heading { fill: #f4f8f5; font-size: 38px; font-weight: 700; }
      .subtitle { fill: #a9b9ae; font-size: 20px; font-weight: 400; }
      .step { fill: #08110c; font-size: 17px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
      .card-title { fill: #f6faf7; font-size: 23px; font-weight: 700; }
      .card-copy { fill: #c8d4cc; font-size: 17px; font-weight: 400; }
      .small-title { fill: #f4f8f5; font-size: 18px; font-weight: 700; }
      .small-copy { fill: #aebcb3; font-size: 15px; font-weight: 400; }
      .flow-label { fill: #8fa097; font-size: 14px; font-weight: 600; letter-spacing: 0.7px; text-anchor: middle; }
      .foundation-title { fill: #75db91; font-size: 17px; font-weight: 700; }
      .foundation-copy { fill: #c4d0c8; font-size: 15px; font-weight: 400; }
    </style>
  </defs>

  <rect width="1600" height="780" rx="32" fill="url(#background)"/>
  <path d="M0 655 C340 590 630 735 970 664 C1235 610 1400 650 1600 590" fill="none" stroke="#1d3a29" stroke-width="1.5" opacity="0.45"/>
  <path d="M0 705 C330 640 700 785 1040 700 C1290 638 1450 685 1600 635" fill="none" stroke="#1d3a29" stroke-width="1" opacity="0.3"/>

  <text x="64" y="67" class="eyebrow">SYSTEM ARCHITECTURE</text>
  <text x="64" y="116" class="heading">From task intent to an observable run</text>
  <text x="64" y="151" class="subtitle">One durable control plane normalizes planning, bounded execution, verification, isolation, and live telemetry.</text>

  <!-- Primary flow -->
  <line x1="345" y1="330" x2="405" y2="330" stroke="#75db91" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="375" y="307" class="flow-label">TASK</text>

  <line x1="985" y1="330" x2="1045" y2="330" stroke="#f1b55e" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <text x="1015" y="307" class="flow-label">RUN</text>

  <!-- Operator card -->
  <g filter="url(#softShadow)">
    <rect x="64" y="213" width="280" height="235" rx="22" fill="#101d15" stroke="#2b5c3b" stroke-width="2"/>
    <circle cx="101" cy="252" r="18" fill="#75db91"/>
    <text x="101" y="252" class="step">1</text>
    <text x="132" y="260" class="card-title">Operator</text>
    <rect x="91" y="286" width="226" height="112" rx="14" fill="#0a130e" stroke="#254d33"/>
    <rect x="111" y="307" width="96" height="10" rx="5" fill="#75db91" opacity="0.9"/>
    <rect x="111" y="331" width="180" height="7" rx="3.5" fill="#53665a"/>
    <rect x="111" y="350" width="142" height="7" rx="3.5" fill="#394a40"/>
    <rect x="111" y="371" width="72" height="12" rx="6" fill="#2d7a48"/>
    <text x="204" y="425" class="small-copy" text-anchor="middle">React operator interface</text>
  </g>

  <!-- Control-plane card -->
  <g filter="url(#softShadow)">
    <rect x="406" y="187" width="578" height="315" rx="24" fill="url(#controlPanel)" stroke="#3f8a58" stroke-width="2.5"/>
    <circle cx="445" cy="228" r="18" fill="#75db91" filter="url(#greenGlow)"/>
    <text x="445" y="228" class="step">2</text>
    <text x="477" y="236" class="card-title">FastAPI control plane</text>
    <text x="945" y="235" class="small-copy" text-anchor="end">provider-neutral</text>

    <rect x="437" y="269" width="247" height="188" rx="18" fill="#0b1810" stroke="#326b46"/>
    <text x="463" y="304" class="small-title">Plan deterministically</text>
    <circle cx="466" cy="336" r="4" fill="#75db91"/>
    <text x="480" y="342" class="card-copy">Prompt + context contracts</text>
    <circle cx="466" cy="373" r="4" fill="#75db91"/>
    <text x="480" y="379" class="card-copy">Repository evidence</text>
    <circle cx="466" cy="410" r="4" fill="#75db91"/>
    <text x="480" y="416" class="card-copy">Profiler + selector</text>

    <rect x="706" y="269" width="247" height="188" rx="18" fill="#0b1810" stroke="#326b46"/>
    <text x="732" y="304" class="small-title">Execute + verify</text>
    <circle cx="735" cy="336" r="4" fill="#75db91"/>
    <text x="749" y="342" class="card-copy">Bounded feedback loops</text>
    <circle cx="735" cy="373" r="4" fill="#75db91"/>
    <text x="749" y="379" class="card-copy">Independent verifiers</text>
    <circle cx="735" cy="410" r="4" fill="#75db91"/>
    <text x="749" y="416" class="card-copy">Event normalization</text>
  </g>

  <!-- Runtime card -->
  <g filter="url(#softShadow)">
    <rect x="1046" y="213" width="490" height="235" rx="22" fill="url(#runtimePanel)" stroke="#8a6631" stroke-width="2"/>
    <circle cx="1084" cy="252" r="18" fill="#f1b55e"/>
    <text x="1084" y="252" class="step">3</text>
    <text x="1116" y="260" class="card-title">Runtime adapters</text>

    <rect x="1075" y="294" width="132" height="106" rx="15" fill="#16140e" stroke="#735328"/>
    <circle cx="1141" cy="325" r="9" fill="#75db91"/>
    <text x="1141" y="361" class="small-title" text-anchor="middle">Codex</text>
    <text x="1141" y="384" class="small-copy" text-anchor="middle">App Server</text>

    <rect x="1225" y="294" width="132" height="106" rx="15" fill="#16140e" stroke="#735328"/>
    <circle cx="1291" cy="325" r="9" fill="#f1b55e"/>
    <text x="1291" y="361" class="small-title" text-anchor="middle">Claude</text>
    <text x="1291" y="384" class="small-copy" text-anchor="middle">Code CLI</text>

    <rect x="1375" y="294" width="132" height="106" rx="15" fill="#16140e" stroke="#735328"/>
    <circle cx="1441" cy="325" r="9" fill="#93a49a"/>
    <text x="1441" y="361" class="small-title" text-anchor="middle">Fake</text>
    <text x="1441" y="384" class="small-copy" text-anchor="middle">Deterministic</text>
  </g>

  <!-- Foundation connections -->
  <path d="M695 502 V548" stroke="#75db91" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1290 448 V548" stroke="#f1b55e" stroke-width="3" marker-end="url(#arrowAmber)"/>

  <!-- Durable foundation -->
  <g filter="url(#softShadow)">
    <rect x="406" y="550" width="1130" height="151" rx="22" fill="#0c1610" stroke="#2a4934" stroke-width="2"/>
    <circle cx="445" cy="589" r="18" fill="#75db91"/>
    <text x="445" y="589" class="step">4</text>
    <text x="477" y="596" class="card-title">Durable foundation</text>

    <rect x="437" y="621" width="325" height="54" rx="12" fill="#13231a" stroke="#315d40"/>
    <text x="458" y="643" class="foundation-title">PostgreSQL</text>
    <text x="458" y="664" class="foundation-copy">Tasks, decisions, state, ordered events</text>

    <rect x="785" y="621" width="325" height="54" rx="12" fill="#13231a" stroke="#315d40"/>
    <text x="806" y="643" class="foundation-title">Resumable SSE</text>
    <text x="806" y="664" class="foundation-copy">Reconnect-safe live execution trace</text>

    <rect x="1133" y="621" width="372" height="54" rx="12" fill="#13231a" stroke="#315d40"/>
    <text x="1154" y="643" class="foundation-title">Disposable Git worktrees</text>
    <text x="1154" y="664" class="foundation-copy">One isolated workspace per mutable run</text>
  </g>

  <!-- Observable feedback path -->
  <path d="M948 675 V716 H240 Q191 716 191 667 V470" fill="none" stroke="#75db91" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowGreen)"/>
  <rect x="287" y="701" width="190" height="29" rx="14.5" fill="#12251a" stroke="#2d6d44"/>
  <text x="382" y="721" class="flow-label">LIVE TRACE</text>

  <text x="800" y="758" class="small-copy" text-anchor="middle">Deterministic planning  •  Bounded feedback  •  Independent verification  •  Durable evidence</text>
</svg>
