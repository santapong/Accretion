<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Accretion control-plane architecture</title>
  <desc id="description">A React operator interface sends HTTP commands to the FastAPI control plane and reads snapshots and resumable server-sent events. The control plane owns deterministic planning, optional evidence-aware node routing, bounded execution and independent verification. Capability policy, approvals and credential brokering govern dispatch. Runtime adapters connect Codex App Server, Claude Code, opencode and a deterministic fake runtime. PostgreSQL stores authoritative state, decisions, evidence and ordered events. Disposable Git worktrees isolate mutable runs and supply captured candidates. Runtime observations return to the control plane; provider completion is not acceptance. Node routing is opt-in and its shipped fallback catalog is FAKE-only.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#07100c"/><stop offset="1" stop-color="#101813"/></linearGradient>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#83d4a3" stroke-width="1.6"/></marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#e6b26a" stroke-width="1.6"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2.5px;fill:#83d4a3}.heading{font-size:34px;font-weight:700;fill:#f5f2e9}.intro{font-size:17px;fill:#aec0b5}.title{font-size:22px;font-weight:700;fill:#f5f2e9}.body{font-size:17px;fill:#c0cfc6}.small{font-size:14px;fill:#94aa9c}.module{font-size:18px;font-weight:700;fill:#f5f2e9}.edge{font-size:12px;fill:#aec0b5;text-anchor:middle}.caption{font-size:14px;fill:#aec0b5}.label{font-size:13px;fill:#83d4a3;font-weight:700;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1200" height="760" rx="20" fill="url(#background)"/>
  <text x="40" y="45" class="eyebrow">SYSTEM ARCHITECTURE</text>
  <text x="40" y="91" class="heading">One authority. Multiple runtimes.</text>
  <text x="40" y="122" class="intro">Policy, state and acceptance belong to the control plane.</text>

  <g>
    <rect x="40" y="185" width="230" height="328" rx="14" fill="#0e1b14" stroke="#2b4937"/>
    <text x="62" y="224" class="title">Operator interface</text>
    <text x="62" y="253" class="small">React · TypeScript</text>
    <path d="M62 275H248" stroke="#2b4134"/>
    <text x="62" y="312" class="body">Tasks and planning</text>
    <text x="62" y="350" class="body">Live run controls</text>
    <text x="62" y="388" class="body">Approvals and audit</text>
    <text x="62" y="426" class="body">Experiment Studio</text>
    <text x="62" y="480" class="small">Snapshots + ordered events</text>
  </g>

  <path d="M270 292H328" fill="none" stroke="#83d4a3" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="299" y="279" class="edge">HTTP</text>
  <path d="M330 436H272" fill="none" stroke="#83d4a3" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="299" y="458" class="edge">SSE</text>

  <g>
    <rect x="330" y="163" width="480" height="396" rx="16" fill="#102018" stroke="#4f8a66"/>
    <text x="354" y="204" class="title">FastAPI control plane</text>
    <text x="354" y="233" class="small">Versioned contracts · explicit state transitions</text>
    <rect x="352" y="255" width="214" height="98" rx="9" fill="#091710" stroke="#2b4937"/>
    <text x="370" y="284" class="module">Plan</text>
    <text x="370" y="311" class="small">Profile and select</text>
    <text x="370" y="333" class="small">a bounded workflow</text>
    <rect x="580" y="255" width="208" height="98" rx="9" fill="#091710" stroke="#2b4937"/>
    <text x="598" y="284" class="module">Route</text>
    <text x="598" y="311" class="small">Evidence-aware selection</text>
    <text x="598" y="333" class="small">Opt-in · durable receipts</text>
    <rect x="352" y="365" width="214" height="98" rx="9" fill="#091710" stroke="#2b4937"/>
    <text x="370" y="394" class="module">Execute</text>
    <text x="370" y="421" class="small">Budgets, feedback loops</text>
    <text x="370" y="443" class="small">and recovery</text>
    <rect x="580" y="365" width="208" height="98" rx="9" fill="#091710" stroke="#2b4937"/>
    <text x="598" y="394" class="module">Verify</text>
    <text x="598" y="421" class="small">Independent checks on</text>
    <text x="598" y="443" class="small">immutable candidates</text>
    <path d="M352 482H788" stroke="#365542"/>
    <text x="354" y="513" class="label">GOVERNED DISPATCH</text>
    <text x="354" y="537" class="small">Capability policy · approvals · credential broker</text>
  </g>

  <path d="M810 292H868" fill="none" stroke="#e6b26a" stroke-width="2" marker-end="url(#amber-arrow)"/>
  <text x="839" y="279" class="edge">Invoke</text>
  <path d="M870 436H812" fill="none" stroke="#e6b26a" stroke-width="2" marker-end="url(#amber-arrow)"/>
  <text x="839" y="458" class="edge">Events</text>

  <g>
    <rect x="870" y="185" width="290" height="328" rx="14" fill="#1b1a11" stroke="#605032"/>
    <text x="894" y="224" class="title">Runtime adapters</text>
    <text x="894" y="253" class="small">One normalized lifecycle</text>
    <path d="M894 275H1136" stroke="#4b432f"/>
    <circle cx="899" cy="307" r="4" fill="#e6b26a"/>
    <text x="914" y="313" class="body">Codex App Server</text>
    <circle cx="899" cy="349" r="4" fill="#e6b26a"/>
    <text x="914" y="355" class="body">Claude Code</text>
    <circle cx="899" cy="391" r="4" fill="#e6b26a"/>
    <text x="914" y="397" class="body">opencode</text>
    <circle cx="899" cy="433" r="4" fill="#83d4a3"/>
    <text x="914" y="439" class="body">FAKE</text>
    <text x="894" y="480" class="small">Signed-in providers are opt-in</text>
  </g>

  <path d="M570 559V611" fill="none" stroke="#83d4a3" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="692" y="593" class="edge">Persist state and evidence</text>
  <path d="M1015 513V611" fill="none" stroke="#e6b26a" stroke-width="2" marker-end="url(#amber-arrow)"/>
  <text x="1055" y="585" class="edge">Run in</text>

  <g>
    <rect x="330" y="613" width="480" height="91" rx="12" fill="#0e1b14" stroke="#2b4937"/>
    <text x="352" y="646" class="module">PostgreSQL</text>
    <text x="352" y="677" class="small">Run state · decisions · verifier evidence · ordered events</text>
    <rect x="870" y="613" width="290" height="91" rx="12" fill="#1b1a11" stroke="#605032"/>
    <text x="892" y="646" class="module">Git worktrees</text>
    <text x="892" y="677" class="small">Isolated runs · captured changes</text>
  </g>
  <text x="40" y="646" class="label">DURABLE BY DESIGN</text>
  <text x="40" y="675" class="caption">Inspect. Reconnect. Recover.</text>
  <text x="40" y="735" class="small">Node routing is disabled by default; its shipped fallback catalog is FAKE-only. External execution can remain uncertain.</text>
</svg>
