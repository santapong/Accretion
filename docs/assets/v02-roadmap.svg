<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">Accretion v0.2 implementation roadmap</title>
  <desc id="description">The completed v0.1 gate unlocks three ordered v0.2 milestones. P5 adds validated dynamic workflow proposals and revisions, P6 adds evidence-based routing and bounded search, and P7 adds retrieval and replay of verified experience. The release gate requires benefit over the static baseline with no safety regression.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100b"/><stop offset="1" stop-color="#111710"/></linearGradient><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#75db91"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f1b55e"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.eyebrow{fill:#75db91;font-size:17px;font-weight:700;letter-spacing:3px}.heading{fill:#f4f8f5;font-size:36px;font-weight:700}.sub{fill:#a9b9ae;font-size:18px}.phase{fill:#75db91;font-size:14px;font-weight:800;letter-spacing:2px}.phase.amber{fill:#f1b55e}.title{fill:#f6faf7;font-size:22px;font-weight:700}.copy{fill:#b9c8be;font-size:15px}.label{fill:#8fa097;font-size:13px;font-weight:700;letter-spacing:1px;text-anchor:middle}.gate{fill:#08110c;font-size:16px;font-weight:800;text-anchor:middle;dominant-baseline:central}</style>
  </defs>
  <rect width="1600" height="760" rx="30" fill="url(#bg)"/><text x="60" y="64" class="eyebrow">V0.2 DELIVERY PLAN</text><text x="60" y="112" class="heading">Dynamic orchestration, unlocked in evidence-gated stages</text><text x="60" y="146" class="sub">The v0.1 deterministic authority boundary remains unchanged throughout the release.</text>
  <g>
    <rect x="58" y="218" width="246" height="254" rx="22" fill="#10251a" stroke="#3f8a58" stroke-width="2"/><text x="84" y="256" class="phase">ENTRY GATE</text><text x="84" y="294" class="title">v0.1 complete</text><text x="84" y="334" class="copy">static baseline recorded</text><text x="84" y="362" class="copy">verifier evidence stable</text><text x="84" y="390" class="copy">contracts + traces durable</text><circle cx="181" cy="438" r="18" fill="#75db91"/><text x="181" y="438" class="gate">✓</text>
    <rect x="366" y="218" width="292" height="254" rx="22" fill="#101d15" stroke="#315d40" stroke-width="2"/><text x="392" y="256" class="phase">P5</text><text x="392" y="294" class="title">Dynamic workflows</text><text x="392" y="334" class="copy">WorkflowProposal contract</text><text x="392" y="362" class="copy">deterministic GraphValidator</text><text x="392" y="390" class="copy">immutable graph revisions</text><text x="392" y="430" class="copy">UI proposal + replan views</text>
    <rect x="720" y="218" width="292" height="254" rx="22" fill="#211a10" stroke="#7c5c2c" stroke-width="2"/><text x="746" y="256" class="phase amber">P6</text><text x="746" y="294" class="title">Routing + search</text><text x="746" y="334" class="copy">interpretable runtime scoring</text><text x="746" y="362" class="copy">bounded best-of-N</text><text x="746" y="390" class="copy">cross-provider candidates</text><text x="746" y="430" class="copy">verifier-ranked selection</text>
    <rect x="1074" y="218" width="292" height="254" rx="22" fill="#101d15" stroke="#315d40" stroke-width="2"/><text x="1100" y="256" class="phase">P7</text><text x="1100" y="294" class="title">Verified experience</text><text x="1100" y="334" class="copy">experience records</text><text x="1100" y="362" class="copy">negative knowledge</text><text x="1100" y="390" class="copy">similarity + applicability</text><text x="1100" y="430" class="copy">trajectory replay evidence</text>
    <path d="M304 345H356" stroke="#75db91" stroke-width="4" marker-end="url(#g)"/><path d="M658 345H710" stroke="#f1b55e" stroke-width="4" marker-end="url(#a)"/><path d="M1012 345H1064" stroke="#75db91" stroke-width="4" marker-end="url(#g)"/>
  </g>
  <rect x="1408" y="218" width="134" height="254" rx="22" fill="#211a10" stroke="#7c5c2c" stroke-width="2"/><text x="1475" y="258" class="phase amber" text-anchor="middle">GATE</text><text x="1475" y="304" class="title" text-anchor="middle">v0.2</text><text x="1475" y="346" class="copy" text-anchor="middle">benefit</text><text x="1475" y="372" class="copy" text-anchor="middle">without</text><text x="1475" y="398" class="copy" text-anchor="middle">safety</text><text x="1475" y="424" class="copy" text-anchor="middle">regression</text><path d="M1366 345H1398" stroke="#f1b55e" stroke-width="4" marker-end="url(#a)"/>
  <rect x="176" y="538" width="1248" height="118" rx="20" fill="#0d1b12" stroke="#2d5a3b" stroke-width="2"/><text x="206" y="576" class="phase">INHERITED INVARIANTS</text><text x="206" y="612" class="copy">deterministic authority ceilings • fail-closed verification • durable event ordering • isolated workspaces • bounded budgets • operator-visible evidence</text><text x="800" y="697" class="label">EACH PHASE SHIPS BEHIND VERSIONED CONTRACTS AND MUST PRESERVE THE STATIC BASELINE</text>
</svg>
