# Acceptance verification policy.
#
# The SDDs are the source of truth for WHAT the criteria are; this file records only
# HOW each is verified. A criterion absent from this file must be proven by a test
# that claims it with @pytest.mark.acceptance("<id>").
#
#   verification = "test"          proven by a marked, passing test (the default)
#   verification = "manual"        needs evidence + last_verified; goes stale after 180 days
#   verification = "waived"        needs reason + issue + expires; fails once expired
#   verification = "frontend"      proven by the vitest suite CI runs; evidence must be
#                                  one or more `apps/ui/<path>.test.tsx:<line> <test title>`
#                                  pointers separated by ` + `, each anchored on the
#                                  opening line of the vitest test it names; the gate
#                                  fails if a file, a line, or the title drifts
#   verification = "not_yet_due"   belongs to a milestone that has not started
#
#   frontend_evidence = "..."      an extra, path-and-title-checked vitest pointer on a
#                                  criterion still proven by pytest, for criteria whose
#                                  pytest claim covers only part of the surface
#
# Both escape hatches expire on purpose. An audit records what someone believed on one
# day; this file makes every belief carry an end date.

[criteria]

